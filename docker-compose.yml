version: "3.9"

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - chroma_data:/srv/chroma_db
      - sql_data:/srv/data

  ingestion-service:
    build: .
    command: flask --app app_flask_ingest run --host 0.0.0.0 --port 5001
    ports:
      - "5001:5001"
    env_file: .env
    volumes:
      - chroma_data:/srv/chroma_db
      - sql_data:/srv/data

volumes:
  chroma_data:
  sql_data:
